name: Go UI macOS

on:
  pull_request:
    paths:
      - '.github/workflows/goui.yml'
      - 'apps/goui/**'
      - 'internal/**'
      - 'testdata/fixtures/native/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths:
      - '.github/workflows/goui.yml'
      - 'apps/goui/**'
      - 'internal/**'
      - 'testdata/fixtures/native/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record toolchain and host
        run: |
          go version
          sw_vers
          uname -m
          xcrun --show-sdk-version
      - name: Core frozen gate
        run: make fmt vet test race license build
      - name: Go UI tests and production build
        run: make goui-check
      - name: Go UI race and static checks
        working-directory: apps/goui
        run: |
          GOWORK=off go test -race -count=1 ./...
          GOWORK=off CGO_ENABLED=0 go vet ./...
      - name: Build and inspect unsigned development package
        run: |
          OUT_DIR="$RUNNER_TEMP/goui-package" VERSION=0.0.0-ci ./apps/goui/package.sh
          ./apps/goui/verify-package.sh "$RUNNER_TEMP/goui-package" 0.0.0-ci "$(go env GOARCH)"
