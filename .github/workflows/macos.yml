name: native-macos
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record selected toolchain
        run: |
          go version
          # The native desktop clients are retired, so no Swift toolchain is
          # required; the release artifact is the Go binary with the
          # transplanted web UI embedded.
          uname -m
      - name: Core gates (no Node required)
        run: make fmt vet test race license build
      - name: Strict pinned v3 accounting comparison and AVERAGE extension
        run: make parity-full
      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCount-arm64-development
          path: bin/orangecount
          if-no-files-found: error
