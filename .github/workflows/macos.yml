name: native-macos
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record selected toolchain
        run: |
          go version
          xcrun swiftc --version
          xcrun --show-sdk-version
      - name: Core and native gates
        run: make fmt vet test race license build mac-check
      - name: Strict pinned v3 accounting comparison and AVERAGE extension
        run: make parity-full
      - name: Assemble development package
        run: make mac-package
      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCount-arm64-development
          path: dist/macos/
          if-no-files-found: error
